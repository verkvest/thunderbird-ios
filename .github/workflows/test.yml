# Run tests and analyze builds

name: Xcode Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      DEVICE: "iPhone 17"
      XCODE_VERSION: "26.4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Xcode Select Version
        uses: mobiledevops/xcode-select-version-action@7b50160de7c8bd6a8c4ee2c2e6b5ee0983886c0b # v1.1.0
        with:
          xcode-select-version: ${{ env.XCODE_VERSION }}

      - name: Ensure iOS Simulator Runtime installed
        run: |
          if xcrun simctl list runtimes | grep -q "iOS 26"; then
            echo "iOS 26 simulator runtime already installed"
          else
            xcodebuild -downloadPlatform iOS
          fi

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace Thunderbird.xcworkspace \
            -scheme Thunderbird

      - name: Build and analyze
        run: |
          xcodebuild clean build analyze \
            -workspace Thunderbird.xcworkspace \
            -scheme Thunderbird \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: List available simulators
        run: xcrun simctl list devices

      - name: Boot simulator
        uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 15
          command: |
            set -x
            echo "Booting ${DEVICE} simulator..."
            xcrun simctl shutdown "${DEVICE}" || true
            xcrun simctl boot "${DEVICE}" || true
            xcrun simctl bootstatus "${DEVICE}" -b
            echo "Simulator booted and ready."

      - name: Run tests
        uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            echo "Running tests in ${DEVICE} simulator..."
            xcodebuild test \
              -workspace Thunderbird.xcworkspace \
              -scheme ThunderbirdTests \
              -sdk iphonesimulator \
              -destination "platform=iOS Simulator,name=${DEVICE}" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              DEVELOPMENT_TEAM= \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO

      - name: Archive (Release, unsigned)
        run: |
          xcodebuild clean archive \
            -workspace Thunderbird.xcworkspace \
            -scheme Thunderbird \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Thunderbird.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
